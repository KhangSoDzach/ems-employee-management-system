version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ems-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ems_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_USER: ${MYSQL_USER:-emsuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-emspass123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Thư mục này để chứa init scripts chạy một lần khi DB chưa có data.
      # MySQL official image tự tạo MYSQL_USER với quyền trên MYSQL_DATABASE;
      # thêm .sql/.sh vào đây nếu cần grant bổ sung hoặc seed dữ liệu.
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro
    networks:
      - ems-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ems-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Activate the docker Spring profile — datasource URL is defined in application-docker.yaml
      SPRING_PROFILES_ACTIVE: docker
      # DB credentials (must match the mysql service above)
      MYSQL_USER: ${MYSQL_USER:-emsuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-emspass123}
      # Disable mail health indicator in Actuator to avoid failing overall health
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      JWT_SECRET: ${JWT_SECRET:-changeme-secret-key-for-development-only-minimum-256-bits-required-please-use-env-variable}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-changeme-refresh-secret-key-for-development-only-use-env-variable-in-production}
    ports:
      - "8080:8080"
    networks:
      - ems-network
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # React Frontend (Development with Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ems-frontend
    restart: unless-stopped
    user: "0:0" # Run as root in dev so Vite can write temp files in bind-mounted /app
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
    ports:
      - "5173:5173"
    volumes:
      # Mount source code for hot reload
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
    networks:
      - ems-network
    healthcheck:
      test: [ "CMD", "wget", "-O", "/dev/null", "-q", "http://127.0.0.1:5173/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  ems-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
