# Renamed scope: ESLint + tsc are now in ci.yml.
# This file owns SECURITY SCANNING only.
#
# Triggers:
#   - push to main (post-merge gate)
#   - weekly schedule (catch newly-disclosed CVEs)
#   - NOT on every PR — avoid burning minutes on draft code
name: Security Scan

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'  # Every Monday 03:00 UTC
  workflow_dispatch:     # Allow manual trigger

jobs:
  # ─────────────────────────────────────────
  # Trivy filesystem scan—SARIF uploaded to GitHub Security tab
  # ─────────────────────────────────────────
  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy (CRITICAL + HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'    # Block on CRITICAL/HIGH findings

      - name: Upload results to GitHub Security
        # Run even when trivy exits 1 so results are visible in the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # ─────────────────────────────────────────
  # npm audit — fail on high-severity JS deps
  # ─────────────────────────────────────────
  npm-audit:
    name: npm Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Audit frontend dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=high
