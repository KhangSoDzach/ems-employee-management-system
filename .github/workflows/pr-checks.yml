name: PR Checks

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  # ─────────────────────────────────────────
  # Enforce Conventional Commits title format.
  # Removed continue-on-error — this now BLOCKS the PR.
  # ─────────────────────────────────────────
  pr-title-check:
    name: PR Title — Conventional Commits
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
          requireScope: false


