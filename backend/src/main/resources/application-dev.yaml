# ─────────────────────────────────────────────────────────────
# Profile: dev  (local development with XAMPP / local MySQL)
# Activate: SPRING_PROFILES_ACTIVE=dev
# ─────────────────────────────────────────────────────────────
spring:
  datasource:
    # XAMPP default: root user, no password (or set your own password below)
    url: jdbc:mysql://localhost:3306/ems_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DEV_DB_USERNAME:root}
    password: ${DEV_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Mail configuration for dev (real email is enabled by default; set MAIL_ENABLED=false to force mock)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 5000

  # Flyway — dev profile: allow repair in case of local migration errors
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    out-of-order: true
    repair-on-migrate: true

# Logging: more verbose for development
logging:
  level:
    root: INFO
    com.company.ems.backend: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# App mail configuration for dev
app:
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@ems.company.com}
