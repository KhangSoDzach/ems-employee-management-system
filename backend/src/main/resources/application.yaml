spring:
  application:
    name: ems-backend
  
  # Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/ems_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: 
    # ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update  # Auto-create missing tables (changed from validate)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        enable_lazy_load_no_trans: false
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false
  
  # Flyway Configuration for Database Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    repair-on-migrate: true
    validate-on-migrate: false
    clean-disabled: true  # Safety: prevent accidental data loss
    out-of-order: false
    validate-migration-naming: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:changeme-secret-key-for-development-only-minimum-256-bits-required-please-use-env-variable}
  refresh-secret: ${JWT_REFRESH_SECRET:changeme-refresh-secret-key-for-development-only-use-env-variable-in-production}
  expiration-ms: 1800000  # 30 minutes (in milliseconds)
  refresh-expiration-ms: 604800000  # 7 days (in milliseconds)
  issuer: ems-backend
  audience: ems-app

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
  show-actuator: false
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# Logging Configuration
logging:
  level:
    root: INFO
    com.company.ems.backend: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/ems-backend.log
    max-size: 10MB
    max-history: 30

# File Upload Configuration
spring.servlet.multipart:
  enabled: true
  max-file-size: 10MB
  max-request-size: 10MB
  file-size-threshold: 2KB

# Application Custom Properties
app:
  name: Employee Management System
  version: 1.0.0
  description: Enterprise-grade EMS backend API
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173,http://localhost:5174
  security:
    jwt:
      header: Authorization
      prefix: Bearer
  file:
    upload-dir: uploads/
    max-size: 10485760  # 10MB in bytes
